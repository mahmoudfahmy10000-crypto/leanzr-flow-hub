name: Engineering regression checks

on:
  push:
  pull_request:

jobs:
  phase-one:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Baseline has no lockfile and declares conflicting Vite/esbuild peer ranges.
      # Keep dependency maintenance separate; do not rewrite its manifest resolution here.
      - run: npm install --legacy-peer-deps --package-lock=false --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/browser/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run test:browser
